# The client only ever talks to its own origin: in development Vite proxies
# /api and /ws through to the server, and in the container nginx does the same
# job. Keeping the two symmetrical is what lets the app ship unchanged.

server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The doorway below redirects, and nginx would otherwise expand a relative
    # Location into an absolute one built from the Host header and its own
    # listen port, which is 80 in here and 18173 outside, so an invite arriving
    # at `http://host:18173/?k=…` would be sent to `http://host/listen?k=…` and
    # land nowhere. The container has no reliable idea what address it is being
    # reached on; the browser does. So it is told where to go, not where to go
    # from.
    absolute_redirect off;

    # Uploads are streamed through to Fastify, which enforces the real ceiling
    # (MAX_UPLOAD_BYTES, 150 MiB by default). Left a little higher here so the
    # rejection comes from the server with a JSON body rather than from nginx.
    client_max_body_size 200m;

    # Docker's embedded DNS, re-resolved so a restarted server container coming
    # back on a new IP does not strand nginx on the old one for its lifetime.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream http://server:3000;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # Hashed filenames, safe to cache hard. index.html deliberately is not.
    # `expires` is left off deliberately: it emits its own Cache-Control, and
    # the two directives together send the header twice.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The root is the page in front of the station: somebody who arrives at the
    # bare address is told what this is, and goes in from there.
    #
    # The one thing that must survive that is an invite. A private station's
    # link is `/?k=<key>`, and links handed out before the doorway moved are
    # still in people's messages, and serving those the landing page would hand the
    # key to a document with no code in it to redeem it. So a request for `/`
    # carrying a key is sent on to the station with the key intact, and only a
    # request without one gets the landing page.
    #
    # `!= ""` rather than `if ($arg_k)`, which is nginx's idea of truth and
    # would read a key of literally "0" as no key at all.
    location = / {
        if ($arg_k != "") {
            return 302 /listen$is_args$args;
        }
        try_files /landing.html =404;
        add_header Cache-Control "no-cache";
    }

    # The page that explains the station. Served without its `.html`, because
    # that is the address in the sitemap, in the canonical link and in every
    # link the other two documents draw, and a page reachable at two addresses
    # is two pages as far as a crawler is concerned.
    location = /how-it-works {
        try_files /how-it-works.html =404;
        add_header Cache-Control "no-cache";
    }

    # The co-host's control surface. Its own document for the reason
    # /how-it-works is: a separate bundle, served without its `.html` because
    # that is the address the link somebody is sent actually says.
    #
    # No `$arg_k` rule here, unlike `/` above, and the difference is worth
    # stating. An invite at `/` has to be forwarded because the landing page has
    # no code in it to redeem a key. This page does: the key on a co-host link
    # is read out of the address bar by the document being served, so with a key
    # or without one the answer is the same file.
    location = /cohost {
        try_files /cohost.html =404;
        add_header Cache-Control "no-cache";
    }

    # Where the landing page used to live. Kept as a redirect rather than
    # deleted: it is in the README, and it was the one link the station itself
    # drew, so anything still saying it should arrive rather than 404.
    location = /welcome {
        return 301 /;
    }

    # Every address that matters names these documents without the extension —
    # the canonical links, the sitemap, every link the pages draw. The file name
    # is a second address for a page that already has one, and `try_files $uri`
    # below would happily answer on it. The canonical tags would cover that;
    # this means there is only ever one address to cover.
    #
    # try_files above serves these files in its own context rather than
    # re-matching, so nothing here catches the pages being served normally.
    location = /landing.html {
        return 301 /;
    }
    location = /how-it-works.html {
        return 301 /how-it-works;
    }
    location = /cohost.html {
        return 301 /cohost;
    }
    location = /index.html {
        return 301 /listen;
    }

    # The station is one document deciding what to show from the fragment, so
    # `/listen`, `/listen#chat` and the `/admin` path that `lib/routes.ts` still
    # honours all land on the same index.html.
    #
    # Named one by one rather than caught by a fallback. `try_files … /index.html`
    # answered *every* unknown path with the station and a 200, which tells a
    # crawler that /whatevr-you-typed is a real page: a soft 404, and as many
    # duplicates of the station as anybody cares to invent. Fragments are how
    # this app moves between its views, so there are two paths in total. They fit.
    location ~ ^/(listen|admin)$ {
        try_files /index.html =404;
        add_header Cache-Control "no-cache";
    }

    # Everything else is a file or it is nothing. This is what serves favicon.svg,
    # apple-touch-icon.png and og.png out of the bundle root, and what answers a
    # typo with a 404 that actually says 404.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # A page rather than nginx's own grey one, and `internal` so /404.html is
    # only ever reachable by being wrong about something else. It ships in
    # public/ rather than as a Vite entry because it has to hold up on a day the
    # bundle does not: a document that needs JavaScript to say "this is not a
    # page" has nothing to say when it is the JavaScript that went missing.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    location /api/ {
        proxy_pass         $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Audio is served with Range support and uploads run to 150 MiB, so
        # neither direction may sit in an nginx buffer waiting to be complete.
        proxy_buffering         off;
        proxy_request_buffering off;
        proxy_read_timeout      300s;
        proxy_send_timeout      300s;
    }

    location /ws {
        proxy_pass         $upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;

        # The station socket is long-lived and mostly quiet between heartbeats.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass       $upstream$request_uri;
        access_log       off;
        proxy_set_header Host $host;
    }

    # The files a crawler asks for. Proxied rather than served from the bundle
    # for the reason `routes/crawl.ts` gives: a sitemap carries absolute URLs,
    # and the only thing that reliably knows what address this station is being
    # reached on is the request. `Host` is forwarded so it can.
    #
    # Above `location /` in effect, since an exact match wins over a prefix one:
    # without these, `try_files … /index.html` answers a robots file with the
    # station, which is a document nothing can read and a 200 saying it could.
    location ~ ^/(robots\.txt|sitemap\.xml|llms\.txt)$ {
        proxy_pass         $upstream$request_uri;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
