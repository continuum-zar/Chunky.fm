name: CI

on:
  push:
    branches: [master]
  pull_request:

# A PR that gets pushed to twice does not need the first run any more; a push to
# master does, because that run is the record of whether master is green.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Both workspaces expose the same three scripts, so one matrix covers them.
  # Node 20 is in there because package.json claims `>=20.12` and the containers
  # ship 22, and without both, one of those two statements quietly stops being true.
  checks:
    name: ${{ matrix.workspace }} (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace: [server, client]
        node: ['20', '22']
    defaults:
      run:
        working-directory: ${{ matrix.workspace }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: ${{ matrix.workspace }}/package-lock.json

      # `npm ci` rather than `npm install`: the lockfile is the input, and a run
      # that silently resolved something newer would not be testing this commit.
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # Server: tsc to dist/. Client: tsc --noEmit then vite build. Both are the
      # step the Dockerfiles run, so a break here is a break in the image too.
      - name: Build
        run: npm run build

  # The property the whole project rests on: two listeners joining at different
  # times land on the same instant of the song. Headless, no browser, ~2s, and it
  # runs on every push because it is the one thing that must never regress.
  sync-check:
    name: sync check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Two listeners must agree
        run: npm run sync-check

  # Unit tests never see nginx, the native sqlite build, or the volume. This job
  # does: it brings up the real compose stack and talks to it over the ports a
  # browser would use.
  stack:
    name: docker compose stack
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-admin-password
      # Set explicitly, because a station with no STATION_KEY is open and this
      # job is here to drive the door. The default coming off the listening side
      # is what made that necessary: without a key the assertions below would be
      # checking that an open station lets everybody in, which is true and
      # tests nothing. See `stationKeyFromEnv`.
      STATION_KEY: ci-station-key
      WEB_PORT: '18173'
      SERVER_PORT: '13000'
    steps:
      - uses: actions/checkout@v5

      - name: Build images
        run: docker compose build

      # --wait honours the HEALTHCHECK in both Dockerfiles, so reaching the next
      # step already means the server answered /health and nginx served a page.
      - name: Start the station
        run: docker compose up -d --wait --wait-timeout 180

      # Everything below goes through the web container on purpose. Hitting the
      # server directly would skip nginx, which is where the proxy rules that
      # make /api and /health work in production actually live.
      - name: Health, through nginx
        run: |
          curl -fsS "http://localhost:$WEB_PORT/health" | tee /dev/stderr | grep -q '"ok":true'

      - name: Health, direct to the server port
        run: |
          curl -fsS "http://localhost:$SERVER_PORT/health" | grep -q '"ok":true'

      - name: The station is served at /listen, and the bundle with it
        run: |
          page=$(curl -fsS "http://localhost:$WEB_PORT/listen")
          grep -q 'id="root"' <<<"$page"
          asset=$(grep -o '/assets/station-[^"]*\.js' <<<"$page" | head -1)
          test -n "$asset" || { echo "/listen is not the station entry"; exit 1; }
          curl -fsS -o /dev/null "http://localhost:$WEB_PORT$asset"

      # The landing page is a second Vite entry, and there are two ways for it
      # to break that a build alone will not catch: the entry silently missing
      # from the image, and the nginx rule not being there, in which case
      # `location /` would answer the root with the station and everything below
      # except the wordmark would still pass. Hence checking for the landing
      # bundle by name rather than for any bundle at all.
      - name: The root is the landing page
        run: |
          page=$(curl -fsS "http://localhost:$WEB_PORT/")
          grep -q 'id="root"' <<<"$page"
          asset=$(grep -o '/assets/landing-[^"]*\.js' <<<"$page" | head -1)
          test -n "$asset" || { echo "/ is not the landing entry"; exit 1; }
          curl -fsS -o /dev/null "http://localhost:$WEB_PORT$asset"

      # The one thing the landing page may not swallow. Invite links handed out
      # before the doorway moved say `/?k=<key>`, and a key handed to a document
      # with no code in it to redeem it is every one of those links broken. So a
      # request for `/` carrying a key must leave for the station with the key
      # still on it.
      - name: An invite at the root still reaches the station
        run: |
          head=$(curl -fsS -o /dev/null -D - "http://localhost:$WEB_PORT/?k=abc123")
          grep -qi '^HTTP/1.1 302' <<<"$head" || { echo "an invite at / was not sent on"; exit 1; }
          # Relative on purpose: `absolute_redirect off`. An absolute Location
          # would be built from nginx's own listen port, which is 80 in the
          # container and $WEB_PORT out here, and the invite would land nowhere.
          grep -qi "^location: /listen?k=abc123" <<<"$head" || {
            echo "the invite did not arrive at the station with its key"; echo "$head"; exit 1
          }
          # And it is followable from out here, which is the thing that breaks
          # if the redirect ever goes absolute again.
          curl -fsS -L "http://localhost:$WEB_PORT/?k=abc123" | grep -q '/assets/station-'
          # And a root with no key on it is the landing page, not a redirect:
          # `if ($arg_k != "")` rather than nginx's own idea of truth.
          curl -fsS "http://localhost:$WEB_PORT/?utm=x" | grep -q '/assets/landing-'

      # Where the landing page used to be. In the README and in whatever the
      # station itself linked to, so it has to arrive rather than 404.
      - name: /welcome still arrives
        run: |
          curl -fsS -L "http://localhost:$WEB_PORT/welcome" | grep -q '/assets/landing-'

      # The third document, and the one with no bundle behind it. Checked for
      # what is *in* it rather than for a 200: the failure this catches is the
      # rule missing, in which case the address is answered by the fallback
      # below, and a fallback answering with a page is the whole problem.
      - name: /how-it-works is the page that explains it
        run: |
          page=$(curl -fsS "http://localhost:$WEB_PORT/how-it-works")
          grep -q 'How chunky.fm works' <<<"$page" || { echo "not the explaining page"; exit 1; }
          grep -q 'application/ld+json' <<<"$page" || { echo "no schema on it"; exit 1; }

      # An address that is nothing must say so, with a status that says so. This
      # was `try_files … /index.html` for a long time: every typo answered with
      # the station and a 200, which is a soft 404 — a crawler told that
      # /whatevr is a real page, and offered as many duplicate stations as
      # anybody cares to invent.
      - name: An address that is nothing is a 404, not the station
        run: |
          for path in /nope /listen/extra /how-it-works/extra; do
            code=$(curl -s -o body.html -w '%{http_code}' "http://localhost:$WEB_PORT$path")
            test "$code" = 404 || { echo "$path answered $code, not 404"; exit 1; }
            grep -q 'nothing at this address' body.html || {
              echo "$path did not get the 404 page"; exit 1
            }
            # `if` rather than `grep … && { exit 1; }`: a grep that finds
            # nothing is the passing case here, and as the last command of an
            # && list its non-zero status would fail the step under `set -e`.
            if grep -q '/assets/station-' body.html; then
              echo "$path was answered with the station"; exit 1
            fi
          done
          # And the documents' own filenames go to the one address they have.
          # `tr -d '\r'` because header lines arrive CRLF-terminated, so a `$`
          # anchor never matches — and without the anchor every /… would pass.
          loc=$(curl -fsS -o /dev/null -D - "http://localhost:$WEB_PORT/landing.html" \
                | tr -d '\r' | grep -i '^location:' | head -1)
          test "$loc" = "location: /" || { echo "/landing.html went to '$loc'"; exit 1; }

      # The unhashed files that answer on their own name. These are the reason
      # this step exists: they live in client/public, they are copied into the
      # image by a line of the Dockerfile that has nothing else depending on it,
      # and when that line was missing everything below still passed — the build
      # succeeded and /og.png was answered by the app-shell fallback with a page
      # of HTML and a 200, so every link to the station unfurled as a grey
      # rectangle. Checking the content type is what catches that; checking for
      # a 200 is what did not.
      - name: The card and the icons are the files, not a page
        run: |
          for pair in "og.png:image/png" "favicon.svg:image/svg+xml" "apple-touch-icon.png:image/png"; do
            path=${pair%%:*}; want=${pair#*:}
            got=$(curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:$WEB_PORT/$path")
            case "$got" in
              "$want"*) ;;
              *) echo "/$path is $got, wanted $want"; exit 1 ;;
            esac
          done

      # The door is on, and it is the library it guards, not the documents. A
      # page has to load in order to redeem a code typed into it, so the two
      # checks above must keep passing without any credential at all.
      - name: The library is behind the door
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:$WEB_PORT/api/tracks")
          test "$code" = 401 || { echo "expected the library to be private, got $code"; exit 1; }

      - name: A code opens it, and the API answers
        run: |
          curl -fsS -X POST -H 'content-type: application/json' \
            -d "{\"key\":\"$STATION_KEY\"}" -c listener.txt \
            "http://localhost:$WEB_PORT/api/listen"
          grep -q chunky_listener listener.txt || { echo "no listener cookie"; exit 1; }
          curl -fsS -b listener.txt "http://localhost:$WEB_PORT/api/tracks" | grep -q 'tracks'

      - name: The wrong code is refused
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"key":"not-the-code"}' \
            "http://localhost:$WEB_PORT/api/listen")
          test "$code" = 401 || { echo "expected 401, got $code"; exit 1; }

      # Proves ADMIN_PASSWORD reached the container and the cookie is issued.
      # The wrong-password half matters just as much, since a misread password
      # that let everyone in would still pass the happy path.
      - name: Admin sign-in refuses the wrong password
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' \
            -d '{"password":"definitely-not-it"}' \
            "http://localhost:$WEB_PORT/api/admin/session")
          test "$code" = 401 || { echo "expected 401, got $code"; exit 1; }

      - name: Admin sign-in accepts the right one
        run: |
          curl -fsS -X POST \
            -H 'content-type: application/json' \
            -d "{\"password\":\"$ADMIN_PASSWORD\"}" \
            -c cookies.txt \
            "http://localhost:$WEB_PORT/api/admin/session" | grep -q '"ok":true'
          grep -q chunky_admin cookies.txt || { echo "no session cookie set"; exit 1; }
          curl -fsS -b cookies.txt "http://localhost:$WEB_PORT/api/admin/session" | grep -q '"ok":true'

      - name: Logs
        if: failure()
        run: docker compose logs --no-color --timestamps

      # -v takes the named volume with it. Nothing here is worth keeping, and a
      # leftover volume would give the next run a pre-populated library.
      - name: Tear down
        if: always()
        run: docker compose down -v --remove-orphans

  # The other supported deployment: one container, no nginx, Fastify serving the
  # client as well as the API. That is what ships to Railway, and the front-door
  # rules it enforces are a *second copy* of the ones the `stack` job checks
  # against nginx, so they get the same assertions, or the two drift and only
  # whichever environment holds the odd copy is wrong.
  single-image:
    name: single image
    runs-on: ubuntu-latest
    env:
      ADMIN_PASSWORD: ci-admin-password
      STATION_KEY: ci-station-key
    steps:
      - uses: actions/checkout@v5

      - name: Build the one image
        run: docker build -t chunky-fm/all-in-one:ci .

      - name: Start it
        run: |
          docker run -d --name chunky -e ADMIN_PASSWORD="$ADMIN_PASSWORD" \
            -e STATION_KEY="$STATION_KEY" -p 13000:3000 chunky-fm/all-in-one:ci
          for i in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' chunky)" = healthy ] && exit 0
            sleep 2
          done
          echo "never became healthy"; docker logs chunky; exit 1

      - name: Health
        run: curl -fsS http://localhost:13000/health | grep -q '"ok":true'

      # The same three front-door assertions the `stack` job makes of nginx.
      - name: The root is the landing page
        run: |
          curl -fsS http://localhost:13000/ | grep -q '/assets/landing-'
          curl -fsS "http://localhost:13000/?utm=x" | grep -q '/assets/landing-'

      - name: An invite at the root still reaches the station
        run: |
          head=$(curl -fsS -o /dev/null -D - "http://localhost:13000/?k=abc123")
          grep -qi '^HTTP/1.1 302' <<<"$head" || { echo "an invite at / was not sent on"; exit 1; }
          # Relative, for the reason nginx needs `absolute_redirect off`: an
          # absolute Location would be built from a host header the container
          # cannot trust, and the invite would land nowhere.
          grep -qi "^location: /listen?k=abc123" <<<"$head" || {
            echo "the invite did not arrive at the station with its key"; echo "$head"; exit 1
          }
          curl -fsS -L "http://localhost:13000/?k=abc123" | grep -q '/assets/station-'

      - name: The station and its assets are served
        run: |
          asset=$(curl -fsS http://localhost:13000/listen | grep -o '/assets/station-[^"]*\.js' | head -1)
          test -n "$asset" || { echo "/listen is not the station entry"; exit 1; }
          curl -fsS -o /dev/null "http://localhost:13000$asset"
          curl -fsS -o /dev/null -D - "http://localhost:13000$asset" | grep -qi 'cache-control:.*immutable'
          curl -fsS -L http://localhost:13000/welcome | grep -q '/assets/landing-'

      # The same three assertions the `stack` job makes of nginx, against the
      # copy of the rules in lib/doorway.ts and lib/errors.ts. This is the
      # deployment Railway runs, so it is the copy that has to be right.
      - name: /how-it-works is the page that explains it
        run: |
          page=$(curl -fsS http://localhost:13000/how-it-works)
          grep -q 'How chunky.fm works' <<<"$page" || { echo "not the explaining page"; exit 1; }
          grep -q 'application/ld+json' <<<"$page" || { echo "no schema on it"; exit 1; }

      - name: An address that is nothing is a 404, not the station
        run: |
          for path in /nope /listen/extra /how-it-works/extra; do
            code=$(curl -s -o body.html -w '%{http_code}' "http://localhost:13000$path")
            test "$code" = 404 || { echo "$path answered $code, not 404"; exit 1; }
            grep -q 'nothing at this address' body.html || {
              echo "$path did not get the 404 page"; exit 1
            }
            if grep -q '/assets/station-' body.html; then
              echo "$path was answered with the station"; exit 1
            fi
          done
          loc=$(curl -fsS -o /dev/null -D - http://localhost:13000/landing.html \
                | tr -d '\r' | grep -i '^location:' | head -1)
          test "$loc" = "location: /" || { echo "/landing.html went to '$loc'"; exit 1; }

      # See the same step in the `stack` job: this is the one that catches
      # client/public not reaching the image, which nothing else does.
      - name: The card and the icons are the files, not a page
        run: |
          for pair in "og.png:image/png" "favicon.svg:image/svg+xml" "apple-touch-icon.png:image/png"; do
            path=${pair%%:*}; want=${pair#*:}
            got=$(curl -fsS -o /dev/null -w '%{content_type}' "http://localhost:13000/$path")
            case "$got" in
              "$want"*) ;;
              *) echo "/$path is $got, wanted $want"; exit 1 ;;
            esac
          done

      # The failure the app-shell fallback would cause if it were not fenced off:
      # a mistyped API route answered with a page of HTML and a 200.
      - name: A mistyped API route is still a JSON 404
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13000/api/wishez)
          test "$code" = 404 || { echo "expected 404, got $code"; exit 1; }
          curl -s http://localhost:13000/api/wishez | grep -q not_found

      # Same shape as the compose job: the door guards the library, never the
      # documents: a page that would not load could never redeem a code.
      - name: The library is behind the door, and a code opens it
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:13000/api/tracks)
          test "$code" = 401 || { echo "expected the library to be private, got $code"; exit 1; }
          curl -fsS -X POST -H 'content-type: application/json' \
            -d "{\"key\":\"$STATION_KEY\"}" -c listener.txt \
            http://localhost:13000/api/listen
          curl -fsS -b listener.txt http://localhost:13000/api/tracks | grep -q tracks

      - name: Admin sign-in works
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'content-type: application/json' -d '{"password":"definitely-not-it"}' \
            http://localhost:13000/api/admin/session)
          test "$code" = 401 || { echo "expected 401, got $code"; exit 1; }
          curl -fsS -X POST -H 'content-type: application/json' \
            -d "{\"password\":\"$ADMIN_PASSWORD\"}" -c cookies.txt \
            http://localhost:13000/api/admin/session | grep -q '"ok":true'
          grep -q chunky_admin cookies.txt || { echo "no session cookie set"; exit 1; }

      - name: Logs
        if: failure()
        run: docker logs chunky

      - name: Tear down
        if: always()
        run: docker rm -f chunky || true
