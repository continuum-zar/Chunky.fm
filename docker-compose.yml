name: chunky-fm

services:
  # The backend, and the database with it: chunky.fm's store is SQLite, opened
  # in-process by better-sqlite3, so there is no database server to run. What
  # would be a db container elsewhere is the `chunky_data` volume here: it
  # holds chunky.sqlite alongside the audio and artwork it refers to, and the
  # three have to stay together to mean anything.
  server:
    build:
      context: ./server
    image: chunky-fm/server:latest
    environment:
      # The one thing an unconfigured station guards. Unset, the server falls
      # back to a code baked into it; see `loadConfig`. Set it here (or in .env)
      # to give the decks a password you chose.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Optional, and empty is the ordinary case: a compose stack is open to
      # listen out of the box, and nobody is asked for anything on the way in.
      # Set this to put a door on; rotating it ends every invite.
      STATION_KEY: ${STATION_KEY:-}
      # Obsolete and harmless: an open station is now the default, so this says
      # nothing. Kept so a file carrying it keeps meaning what it meant.
      STATION_OPEN: ${STATION_OPEN:-}
      # Optional, and empty is the ordinary case: unset, the co-host key is
      # derived from ADMIN_PASSWORD, so a station always has one to hand out and
      # rotating the password rotates it. Set this to rotate the seat on its own.
      CO_HOST_KEY: ${CO_HOST_KEY:-}
      AUDIO_STORAGE_DIR: /data
      HOST: 0.0.0.0
      PORT: "3000"
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-157286400}
      # nginx is in front of this, so every request arrives from the web
      # container's address. The sign-in throttle is keyed on the caller, and
      # would otherwise pace the whole internet as one; see server/.env.example.
      TRUST_PROXY: ${TRUST_PROXY:-true}
    volumes:
      - chunky_data:/data
    ports:
      # Exposed so curl and the QA scripts can reach the API directly; the
      # browser never needs it, everything goes through the web service.
      # Host side stays off 3000; see .env.example.
      - "${SERVER_PORT:-13000}:3000"
    restart: unless-stopped

  web:
    build:
      context: ./client
    image: chunky-fm/web:latest
    ports:
      - "${WEB_PORT:-18173}:80"
    depends_on:
      server:
        # nginx resolves the upstream lazily, but waiting for health means the
        # first page load already has an API behind it.
        condition: service_healthy
    restart: unless-stopped

volumes:
  chunky_data:
    name: chunky-fm_data
